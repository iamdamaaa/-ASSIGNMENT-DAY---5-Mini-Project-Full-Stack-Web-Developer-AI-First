<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#f5f5f0"/>
  <!-- Headband arc -->
  <path d="M150 300 Q150 130 300 130 Q450 130 450 300" fill="none" stroke="#ccc" stroke-width="28" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <ellipse cx="150" cy="320" rx="52" ry="68" fill="#e8e8e8" stroke="#ccc" stroke-width="4"/>
  <ellipse cx="150" cy="320" rx="34" ry="48" fill="#d0d0d0"/>
  <!-- Right ear cup -->
  <ellipse cx="450" cy="320" rx="52" ry="68" fill="#e8e8e8" stroke="#ccc" stroke-width="4"/>
  <ellipse cx="450" cy="320" rx="34" ry="48" fill="#d0d0d0"/>
  <!-- Padding left -->
  <ellipse cx="150" cy="320" rx="26" ry="38" fill="#bbb" opacity="0.5"/>
  <!-- Padding right -->
  <ellipse cx="450" cy="320" rx="26" ry="38" fill="#bbb" opacity="0.5"/>
  <!-- Logo text -->
  <text x="300" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#aaa" text-anchor="middle">JOSSGANDOS</text>
  <text x="300" y="520" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">Putih</text>
</svg>
