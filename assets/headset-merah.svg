<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#1a0505"/>
  <!-- Headband arc -->
  <path d="M150 300 Q150 130 300 130 Q450 130 450 300" fill="none" stroke="#8b0000" stroke-width="28" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <ellipse cx="150" cy="320" rx="52" ry="68" fill="#c0392b" stroke="#a93226" stroke-width="4"/>
  <ellipse cx="150" cy="320" rx="34" ry="48" fill="#96281b"/>
  <!-- Right ear cup -->
  <ellipse cx="450" cy="320" rx="52" ry="68" fill="#c0392b" stroke="#a93226" stroke-width="4"/>
  <ellipse cx="450" cy="320" rx="34" ry="48" fill="#96281b"/>
  <!-- Padding left -->
  <ellipse cx="150" cy="320" rx="26" ry="38" fill="#7b241c" opacity="0.7"/>
  <!-- Padding right -->
  <ellipse cx="450" cy="320" rx="26" ry="38" fill="#7b241c" opacity="0.7"/>
  <!-- Logo text -->
  <text x="300" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">JOSSGANDOS</text>
  <text x="300" y="520" font-family="Arial, sans-serif" font-size="14" fill="#a93226" text-anchor="middle">Merah</text>
</svg>
